version: '3.8'

services:
  prom-tenant-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: prom-tenant-gateway-test
    environment:
      - PORT=8080
      - TENANT_A_TOKEN=test-token-a
      - TENANT_B_TOKEN=test-token-b
      - RATE_LIMIT_MAX=100
      - RATE_LIMIT_WINDOW=10s
    ports:
      - "8080:8080"
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

networks:
  test-network:
    driver: bridge
