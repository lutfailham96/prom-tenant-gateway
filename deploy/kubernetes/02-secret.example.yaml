# EXAMPLE ONLY - not part of kustomization.yaml.
# Applying placeholder tokens would overwrite the real Secret, and the gateway
# refuses to start with CHANGE_ME* tokens. Create the Secret out of band, e.g.:
#
#   kubectl -n mimir create secret generic prom-tenant-gateway-tokens \
#     --from-env-file=tokens.env --dry-run=client -o yaml | kubectl apply -f -
#
# where tokens.env (never committed) contains lines like TENANT_PROD_TOKEN=...
# Generate tokens with: openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: prom-tenant-gateway-tokens
  namespace: mimir
  labels:
    app: prom-tenant-gateway
    app.kubernetes.io/managed-by: kustomize
type: Opaque
stringData:
  # NEW PATTERN (recommended): TENANT_<ID>_TOKEN=<token>
  # Example: TENANT_PROD_TOKEN="prod-secret-token"
  # TENANT_STAGING_TOKEN="staging-secret-token"
  # TENANT_DEV_TOKEN="dev-secret-token"
  #
  # LEGACY PATTERN (also supported): VALID_TOKENS_JSON
  # VALID_TOKENS_JSON: '{"tenant-legacy": "legacy-token"}'
  #
  # REPLACE THESE WITH ACTUAL VALUES BEFORE APPLYING:
  TENANT_PROD_TOKEN: "CHANGE_ME_PROD_TOKEN"
  TENANT_STAGING_TOKEN: "CHANGE_ME_STAGING_TOKEN"