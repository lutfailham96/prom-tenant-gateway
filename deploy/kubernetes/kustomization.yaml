apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mimir

# 00-namespace.yaml is intentionally NOT listed: the mimir namespace is owned
# by the Mimir installation. Listing it here would make `kubectl delete -k`
# delete the whole namespace, including Mimir itself.
resources:
- 01-configmap.yaml
# The token Secret (prom-tenant-gateway-tokens) is managed out of band so that
# `kubectl apply -k` never overwrites real tokens. See 02-secret.example.yaml.
- 03-deployment.yaml
- 04-service.yaml
- 05-hpa.yaml
- 06-poddisruptionbudget.yaml
- 07-rbac.yaml

labels:
- pairs:
    app: prom-tenant-gateway
    app.kubernetes.io/name: prom-tenant-gateway
    app.kubernetes.io/instance: prom-tenant-gateway
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: auth-gateway

images:
- name: lutfailham/prom-tenant-gateway
  newTag: "1.0.0"