apiVersion: apps/v1
kind: Deployment
metadata:
  name: prom-tenant-gateway
  namespace: mimir
  labels:
    app: prom-tenant-gateway
    app.kubernetes.io/managed-by: kustomize
spec:
  # replicas is managed by the HPA (05-hpa.yaml); setting it here would reset
  # the scale on every apply.
  selector:
    matchLabels:
      app: prom-tenant-gateway
  template:
    metadata:
      labels:
        app: prom-tenant-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: prom-tenant-gateway
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: prom-tenant-gateway
        # Single source of the image tag: a pinned release built by CI from git
        # tag v1.0.0. Bump it here; never use :latest. The running version is
        # reported by /healthz and prom_tenant_gateway_build_info.
        image: lutfailham/prom-tenant-gateway:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        envFrom:
        - configMapRef:
            name: prom-tenant-gateway-config
        - secretRef:
            name: prom-tenant-gateway-tokens
        env:
        # Container memory limit in bytes, read from resources.limits.memory
        # below (no value to keep in sync). The gateway sets the Go soft
        # memory limit to 90% of it so the GC works harder before the
        # container is OOM-killed. An explicit GOMEMLIMIT takes precedence.
        - name: MEMORY_LIMIT_BYTES
          valueFrom:
            resourceFieldRef:
              containerName: prom-tenant-gateway
              resource: limits.memory
        lifecycle:
          preStop:
            # Keep serving while endpoints/ingress stop routing to this pod,
            # then SIGTERM triggers the in-app graceful shutdown (10s).
            # Switch to `sleep: {seconds: 5}` if the image drops /bin/sleep.
            exec:
              command: ["sleep", "5"]
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - prom-tenant-gateway
              topologyKey: kubernetes.io/hostname