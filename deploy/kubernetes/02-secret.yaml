apiVersion: v1
kind: Secret
metadata:
  name: prom-tenant-gateway-tokens
  namespace: mimir
  labels:
    app: prom-tenant-gateway
    app.kubernetes.io/managed-by: kustomize
type: Opaque
stringData:
  # NEW PATTERN (recommended): TENANT_<ID>_TOKEN=<token>
  # Example: TENANT_PROD_TOKEN="prod-secret-token"
  # TENANT_STAGING_TOKEN="staging-secret-token"
  # TENANT_DEV_TOKEN="dev-secret-token"
  #
  # LEGACY PATTERN (also supported): VALID_TOKENS_JSON
  # VALID_TOKENS_JSON: '{"tenant-legacy": "legacy-token"}'
  #
  # REPLACE THESE WITH ACTUAL VALUES BEFORE APPLYING:
  TENANT_PROD_TOKEN: "CHANGE_ME_PROD_TOKEN"
  TENANT_STAGING_TOKEN: "CHANGE_ME_STAGING_TOKEN"