# The gateway never calls the Kubernetes API, so it gets a dedicated
# ServiceAccount with no Role/RoleBinding and no mounted API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prom-tenant-gateway
  namespace: mimir
  labels:
    app: prom-tenant-gateway
    app.kubernetes.io/managed-by: kustomize
automountServiceAccountToken: false
