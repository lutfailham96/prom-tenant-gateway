# Middleware: ForwardAuth - Replaces nginx.ingress.kubernetes.io/auth-url
# Validates requests against prom-tenant-gateway before forwarding
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: prom-tenant-gateway-middleware
  namespace: mimir
spec:
  forwardAuth:
    address: http://prom-tenant-gateway-svc.mimir.svc.cluster.local:80/validate-token
    authResponseHeaders:
      - "X-Scope-OrgID"
    authRequestHeaders:
      - "Authorization"
      - "X-Original-URI"
    tls:
      insecureSkipVerify: true