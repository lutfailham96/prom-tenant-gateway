# ReferenceGrant - Allows HTTPRoute to reference Traefik Middleware
# Required for ExtensionRef filter to work with Middleware in same namespace
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: traefik-middleware-ref
  namespace: mimir
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: mimir
  to:
  - group: traefik.io
    kind: Middleware
    namespace: mimir