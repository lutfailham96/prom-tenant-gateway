# HTTPRoute for HTTPS traffic, attached to the shared Traefik Gateway
# traefik/traefik-internal-gateway (owned by the platform, not this repo).
#   /api/v1/push -> mimir-distributed-distributor-headless (write path)
#   /prometheus  -> mimir-distributed-query-frontend       (read path)
# Both rules authenticate through the ForwardAuth middleware, which returns
# the tenant in X-Scope-OrgID.
#
# Attaching from namespace mimir requires the shared Gateway's listener to
# allow routes from this namespace (spec.listeners[].allowedRoutes).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prom-tenant-gateway-internal
  namespace: mimir
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-internal-gateway
      namespace: traefik
      sectionName: https-metrics-v2-internal-obv
  hostnames:
    - metrics-v2.internal.obv.cloudstream.tech
  rules:
    # Push endpoint - write path
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/push
      filters:
        # ExtensionRef is a LocalObjectReference: the Middleware must live in
        # the route's namespace (mimir); it has no namespace field.
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: prom-tenant-gateway-middleware
      backendRefs:
        - name: mimir-distributed-distributor-headless
          port: 8080
    # Query endpoint - read path
    - matches:
        - path:
            type: PathPrefix
            value: /prometheus
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: prom-tenant-gateway-middleware
      backendRefs:
        - name: mimir-distributed-query-frontend
          port: 8080
