# HTTPRoute for HTTPS traffic - Replaces Ingress rules
# Routes /api/v1/push to mimir-distributed-distributor-headless with ForwardAuth
# Routes /prometheus to mimir-distributed-query-frontend with ForwardAuth
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prom-tenant-gateway-internal
  namespace: mimir
spec:
  parentRefs:
    - name: traefik-internal-gateway
      namespace: traefik
      sectionName: https-metrics-v2-internal-obv
  hostnames:
    - metrics-v2.internal.obv.cloudstream.tech
  rules:
    # Push endpoint - write path
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/push
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: prom-tenant-gateway-middleware
            namespace: mimir
      backendRefs:
        - name: mimir-distributed-distributor-headless
          port: 8080
          namespace: mimir
    # Query endpoint - read path
    - matches:
        - path:
            type: PathPrefix
            value: /prometheus
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: prom-tenant-gateway-middleware
            namespace: mimir
      backendRefs:
        - name: mimir-distributed-query-frontend
          port: 8080
          namespace: mimir