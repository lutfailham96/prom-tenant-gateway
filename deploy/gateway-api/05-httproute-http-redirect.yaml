# HTTPRoute for plain HTTP on the shared Gateway: redirects everything to
# HTTPS with the native RequestRedirect filter. There are deliberately no
# backendRefs, so plain-HTTP requests can never reach Mimir (in particular
# not the distributor without the ForwardAuth middleware).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mimir-httproute-http-redirect
  namespace: mimir
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-internal-gateway
      namespace: traefik
      sectionName: http
  hostnames:
    - metrics-v2.internal.obv.cloudstream.tech
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
            statusCode: 301
