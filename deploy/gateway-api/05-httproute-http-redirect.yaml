# HTTPRoute for HTTP traffic - Redirects all HTTP to HTTPS
# Uses redirect-https middleware to enforce HTTPS
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mimir-httproute-http-redirect
  namespace: mimir
spec:
  hostnames:
  - "metrics.obv.cloudstream.tech"
  parentRefs:
  - name: traefik-gateway
    namespace: mimir
    sectionName: http
  rules:
  - filters:
    - type: ExtensionRef
      extensionRef:
        group: traefik.io
        kind: Middleware
        name: redirect-https
        namespace: mimir
    backendRefs:
    - name: mimir-distributed-distributor-headless
      port: 8080
      namespace: mimir
      weight: 1