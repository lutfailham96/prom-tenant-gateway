apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mimir

resources:
  - 00-gatewayclass.yaml
  - 01-gateway.yaml
  - 02-middleware-auth.yaml
  - 03-middleware-redirect.yaml
  - 04-httproute-https.yaml
  - 05-httproute-http-redirect.yaml
  - 06-referencegrant.yaml

# Apply order: GatewayClass -> Gateway -> Middleware -> HTTPRoute -> ReferenceGrant
# GatewayClass is cluster-scoped, others are namespace-scoped