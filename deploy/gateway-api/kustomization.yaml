apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mimir

# The GatewayClass and the shared Gateway (traefik/traefik-internal-gateway)
# are owned by the Traefik/platform installation and are not managed here.
# The routes attach to it cross-namespace via parentRefs. No ReferenceGrant
# is needed: ExtensionRef filters and backendRefs only reference objects in
# the route's own namespace.
resources:
  - 02-middleware-auth.yaml
  - 04-httproute-https.yaml
  - 05-httproute-http-redirect.yaml
